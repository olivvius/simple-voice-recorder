<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Audio</title>
<link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<link href="stylesheets/main.css" rel="stylesheet">
</head>
<body class="container">
    <h1 class="mb-4">Record Your Voice</h1>
    <div class="form-group">
        <label for="audioQuality">Audio Quality:</label>
        <select class="form-control" id="audioQuality">
            <option value="16000" selected>Ultra Low (16kbps)</option>
            <option value="32000">Very Low (32kbps)</option>
            <option value="64000">Low (64kbps)</option>
            <option value="128000">Normal (128kbps)</option>
            <option value="256000">Good (256kbps)</option>
            <option value="320000">Excellent (320kbps)</option>
        </select>
    </div>
    <div class="d-grid gap-2">
        <button id="startRecording" class="btn btn-info">Start Recording</button>
        <button id="stopRecording" class="btn btn-info" disabled>Stop Recording</button>
    </div>
    <p id="status" class="mt-3">Press "Start Recording" to begin.</p>
    <p id="timer" class="mt-2">Duration: 0 second(s)</p>
    <audio id="audioPlayback" class="audio-controls" controls></audio>
    <div class="d-grid gap-2 mt-3">
        <button id="downloadButton" class="btn btn-info" disabled>Download Audio</button>
    </div>
    <script src="scripts/records.js"></script>
</body>
</html>
